name: native
on:
  push:
    paths: ['native/**', 'data/**', 'tests/golden/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'data/**', 'tests/golden/**', '.github/workflows/native.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages for SDL3
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libgl1-mesa-dev libudev-dev libdrm-dev libgbm-dev libasound2-dev
      - uses: actions/cache@v4
        with:
          path: .cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('native/CMakeLists.txt') }}
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DCPM_SOURCE_CACHE=${{ github.workspace }}/.cpm
      - name: Build
        run: cmake --build native/build --config Release --parallel
      - name: Test (unit tests + golden parity against tests/golden)
        run: ctest --test-dir native/build -C Release --output-on-failure
